spring.application.name=school-management-system

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:12MB}

spring.mail.host=${SMTP_HOST:smtp.placeholder.invalid}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:placeholder}
spring.mail.password=${SMTP_PASSWORD:placeholder}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.timeout=${SMTP_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT_MS:10000}
spring.mail.test-connection=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}
app.paystack.enabled=${PAYSTACK_ENABLED:false}
app.paystack.secret-key=${PAYSTACK_SECRET_KEY:}
app.paystack.public-key=${PAYSTACK_PUBLIC_KEY:}
app.paystack.api-url=${PAYSTACK_API_URL:https://api.paystack.co}
app.paystack.currency=${PAYSTACK_CURRENCY:NGN}
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@crestwoodacademy.invalid}
app.mail.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:8080}
app.materials.directory=${MATERIALS_DIRECTORY:./data/study-materials}
app.materials.max-file-size-bytes=${MATERIALS_MAX_FILE_SIZE_BYTES:10485760}
app.uploads.logo-directory=${LOGO_DIRECTORY:./data/school-logo}
app.uploads.logo-max-file-size-bytes=${LOGO_MAX_FILE_SIZE_BYTES:2097152}
app.school.name=${SCHOOL_NAME:Crestwood Academy}
app.seed.enabled=${SEED_ENABLED:true}
app.seed.password=${SEED_PASSWORD:}

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
